<title>Home Touch Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap">
<style>
/* Layout: wall-tablet panel. Left rail (clock, status, groups) beside a grid of large tiles; on phones the rail folds into a top bar with scrolling group chips. Bottom sheets for detail. */
:root{
  --bg:#E4E8EB; --rail:#D8DDE1; --tile:#FBFCFC; --ink:#1B2027; --muted:#5E6772; --line:#C6CDD4;
  --accent:#2D6A88; --accent-ink:#FFFFFF;
  --warm:#E99F22; --warm-tile:#FFE4A8; --warm-ink:#3D2A00;
  --cool:#2F88AE; --cool-tile:#D1EAF4; --cool-ink:#0E3A4C;
  --alert:#B93B25; --alert-tile:#F8D9D0; --alert-ink:#5A1608;
  --ok:#237347; --track:#D2D8DE;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 6px 18px rgba(20,30,40,.07);
  --scrim:rgba(15,20,26,.42);
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-tile:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111418; --rail:#171B20; --tile:#1F242A; --ink:#E8ECEF; --muted:#98A1AB; --line:#2E353C;
  --accent:#86C3DE; --accent-ink:#0D2430;
  --warm:#F5BE55; --warm-tile:#EDBC5E; --warm-ink:#2A1C00;
  --cool:#6FB8D6; --cool-tile:#1C4456; --cool-ink:#DDF2FA;
  --alert:#F07A62; --alert-tile:#4B1F17; --alert-ink:#FFD9D0;
  --ok:#6BCB93; --track:#2B3238; --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111418; --rail:#171B20; --tile:#1F242A; --ink:#E8ECEF; --muted:#98A1AB; --line:#2E353C;
  --accent:#86C3DE; --accent-ink:#0D2430;
  --warm:#F5BE55; --warm-tile:#EDBC5E; --warm-ink:#2A1C00;
  --cool:#6FB8D6; --cool-tile:#1C4456; --cool-ink:#DDF2FA;
  --alert:#F07A62; --alert-tile:#4B1F17; --alert-ink:#FFD9D0;
  --ok:#6BCB93; --track:#2B3238; --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{background:var(--rail);padding-block:18px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.rail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.clock{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin-top:4px}
.edit-btn{min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--tile);font-weight:700}
.editing .edit-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--tile);border:1px solid var(--line);font-size:14px;color:var(--ink)}
.chip .i{width:18px;height:18px}
.chip.alert{background:var(--alert-tile);color:var(--alert-ink);border-color:transparent;font-weight:700}
.chip.ok{color:var(--ok)}
.groups{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.groups::-webkit-scrollbar{display:none}
.g{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:16px;border:0;background:transparent;white-space:nowrap;font-weight:700;text-align:left}
.g .n{margin-left:auto;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px}
.g[aria-current="true"]{background:var(--tile);box-shadow:var(--shadow)}
.g.new{color:var(--accent)}

main{padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px;min-width:0}
.scenes{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.scenes::-webkit-scrollbar{display:none}
main>*{flex-shrink:0}
.scene{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 18px 0 14px;border-radius:18px;border:1px solid var(--line);background:var(--tile);font-weight:700;white-space:nowrap}
.scene:active{transform:scale(.97)}
.scene .i{color:var(--accent)}
.edit-note{display:none;background:var(--tile);border:1.5px dashed var(--accent);border-radius:16px;padding:12px 16px;color:var(--ink)}
.editing .edit-note{display:block}

.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px;text-wrap:balance}
.sec-head .count{color:var(--muted);font-size:15px}
.sec-head .spacer{flex:1}
.pill-btn{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:15px}
.pill-btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec-edit{display:none;gap:8px}
.editing .sec-edit{display:flex}
.editing .master{display:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.tile-wrap{position:relative;min-width:0}
.tile{width:100%;min-height:140px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 14px 16px;border-radius:var(--r-tile);border:0;background:var(--tile);box-shadow:var(--shadow);text-align:left;transition:background-color .2s,transform .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile:active{transform:scale(.97)}
.tile-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:auto;padding-bottom:12px}
.tile-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);transition:background-color .2s,color .2s}
.temp{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;margin-right:36px}
.tile-name{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tile-room{font-size:13px;color:var(--muted)}
.tile-state{font-size:14px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tone-warm{background:var(--warm-tile);color:var(--warm-ink)}
.tone-warm .tile-ico{background:var(--warm);color:var(--warm-ink)}
.tone-warm .tile-room,.tone-warm .tile-state{color:var(--warm-ink);opacity:.78}
.tone-cool{background:var(--cool-tile);color:var(--cool-ink)}
.tone-cool .tile-ico{background:var(--cool);color:var(--tile)}
.tone-cool .tile-room,.tone-cool .tile-state{color:var(--cool-ink);opacity:.8}
.tone-alert{background:var(--alert-tile);color:var(--alert-ink)}
.tone-alert .tile-ico{background:var(--alert);color:var(--tile)}
.tone-alert .tile-room,.tone-alert .tile-state{color:var(--alert-ink)}
.tone-alert .tile-state{font-weight:700;opacity:1}
.tone-ok .tile-ico{color:var(--ok)}
.tone-ok .tile-state{color:var(--ok);font-weight:700}
.tile-more,.tile-remove{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:inherit;opacity:.7}
.tile-wrap:has(.tone-warm) .tile-more{color:var(--warm-ink)}
.tile-wrap:has(.tone-cool) .tile-more{color:var(--cool-ink)}
.tile-wrap:has(.tone-alert) .tile-more{color:var(--alert-ink)}
.tile-remove{display:none;top:-8px;right:-8px;width:40px;height:40px;background:var(--alert);color:#fff;opacity:1;box-shadow:var(--shadow)}
.tile-remove .i{width:20px;height:20px;stroke-width:2.4}
.editing .tile-more{display:none}
.editing .tile-remove{display:grid}
.editing .tile{outline:2px dashed var(--line);outline-offset:-2px}
.add-tile{display:none;min-height:140px;border-radius:var(--r-tile);border:2px dashed var(--line);background:transparent;color:var(--accent);font-weight:700;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.editing .add-tile{display:flex}
.empty{color:var(--muted);padding:8px 0}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{transform:scale(.92)}40%{transform:scale(1.03)}100%{transform:none}}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:60px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--tile);color:var(--ink);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:up .22s ease-out;display:flex;flex-direction:column;gap:18px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .tile-ico{flex:none}
.sh-title{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.sh-sub{color:var(--muted);font-size:14px}
.sh-head .grow{flex:1;min-width:0}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;flex:none}
.power{width:100%;min-height:84px;border-radius:22px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:700}
.power .i{width:30px;height:30px}
.power[aria-pressed="true"]{background:var(--warm);color:var(--warm-ink)}
.power.lock-on{background:var(--bg);color:var(--ok)}
.power.lock-off{background:var(--alert);color:#fff}
.field-label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.field-label output{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
input[type=range].big{-webkit-appearance:none;appearance:none;width:100%;height:64px;border-radius:18px;background:linear-gradient(to right,var(--fill,var(--warm)) var(--p,50%),var(--track) var(--p,50%));margin:0;cursor:pointer;touch-action:pan-y}
input[type=range].big::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:64px;border-radius:12px;background:var(--tile);border:3px solid var(--fill,var(--warm));box-shadow:var(--shadow)}
input[type=range].big::-moz-range-thumb{width:16px;height:58px;border-radius:12px;background:var(--tile);border:3px solid var(--fill,var(--warm))}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:6px;border-radius:18px}
.seg button{min-height:52px;border-radius:13px;border:0;background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--tile);box-shadow:var(--shadow)}
.presets{display:flex;gap:8px;margin-top:10px}
.presets button{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-variant-numeric:tabular-nums}
.thermo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:24px;padding:18px}
.thermo .big-num{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.thermo .cap{color:var(--muted);font-size:14px;text-align:center}
.step{width:72px;height:72px;border-radius:50%;border:0;background:var(--tile);box-shadow:var(--shadow);display:grid;place-items:center}
.step .i{width:30px;height:30px;stroke-width:2.2}
.readout{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.readout b{color:var(--ink);font-variant-numeric:tabular-nums}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.type{min-height:92px;border-radius:18px;border:1.5px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;padding:8px;text-align:center}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--bg);color:var(--accent)}
.txt{width:100%;min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:17px}
.txt:focus{border-color:var(--accent);outline:none}
label.lbl{display:block;font-weight:700;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.sq{width:56px;height:56px;padding:0;justify-content:center;border-radius:16px}
.err{color:var(--alert);font-weight:700;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-height:56px;border-radius:16px;border:0;font-weight:700;font-size:17px;background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--alert);border:1.5px solid currentColor}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s}
.toast button{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline}
.foot{color:var(--muted);font-size:13px}
.foot button{border:0;background:none;color:var(--accent);text-decoration:underline;padding:8px 0;min-height:44px}

@media (min-width:900px){
  .app{grid-template-columns:270px 1fr;height:100%}
  html,body{height:100%}
  .rail{position:sticky;top:0;height:100%;overflow:auto;padding-block:28px 20px;gap:22px}
  .rail-top{flex-direction:column;gap:16px}
  .clock{font-size:64px}
  .groups{flex-direction:column;overflow:visible;margin:0;padding:0}
  .g{width:100%}
  main{overflow:auto;height:100%;padding-block:28px 120px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
  .tile{min-height:164px}
  .add-tile{min-height:164px}
  .scrim{align-items:center}
  .sheet{border-radius:26px;max-height:86%;padding-bottom:24px}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="rail-top">
      <div><div class="clock" id="clock">7:45</div><div class="date" id="date">Thursday</div></div>
      <button class="edit-btn" id="editBtn" data-act="edit">Edit</button>
    </div>
    <div class="summary" id="summary"></div>
    <nav class="groups" id="groups" aria-label="Device groups"></nav>
  </aside>
  <main id="main">
    <div class="scenes" id="scenes" aria-label="Scenes"></div>
    <div class="edit-note">Editing. Tap a device to rename it or move it to another group. Tap the red × to remove it.</div>
    <div id="sections" style="display:flex;flex-direction:column;gap:30px"></div>
    <div class="foot">Example devices for this prototype. Changes are kept in this browser only. <button data-act="reset">Reset example home</button></div>
  </main>
</div>
<button class="fab" data-act="add">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add device
</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
const ICONS={
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  switch:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><rect x="10" y="6" width="4" height="6" rx="1"/>',
  plug:'<path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/>',
  thermo:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 10v6"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.7-1.5"/>',
  blinds:'<path d="M3 3h18M5 3v18M19 3v18M5 7h14M5 11h14M5 15h14M12 15v4"/>',
  fan:'<circle cx="12" cy="12" r="1.8"/><path d="M12 10.2C11 6 12 3 15 3c2 0 2.4 2.6.3 4.4zM13.8 12c4.2-1 7.2 0 7.2 3 0 2-2.6 2.4-4.4.3zM12 13.8c1 4.2 0 7.2-3 7.2-2 0-2.4-2.6-.3-4.4zM10.2 12C6 13 3 12 3 9c0-2 2.6-2.4 4.4-.3z"/>',
  speaker:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><circle cx="12" cy="14" r="3.6"/><circle cx="12" cy="6.5" r="1"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  home:'<path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/>',
  spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5l2 4M14 5l2 4"/>',
  away:'<path d="M3 21h18M6 21V4h9v17M15 4l4 2v15M12 12v1"/>',
  power:'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  pause:'<path d="M8 4v16M16 4v16"/>',
  box:'<rect x="4" y="4" width="16" height="16" rx="3"/>'
};
const svg=(n)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TYPES={
  switch:{label:'Light switch',icon:'switch',light:true},
  dimmer:{label:'Dimmable light',icon:'bulb',light:true},
  plug:{label:'Smart plug',icon:'plug'},
  fan:{label:'Fan',icon:'fan'},
  blinds:{label:'Blinds',icon:'blinds'},
  speaker:{label:'Speaker',icon:'speaker'},
  lock:{label:'Door lock',icon:'lock'},
  thermostat:{label:'Thermostat',icon:'thermo'}
};
const DEFAULTS={switch:{on:false},dimmer:{on:false,level:70},plug:{on:false,watts:60},fan:{on:false,speed:2},blinds:{level:0},speaker:{on:false,volume:30},lock:{locked:true},thermostat:{current:70,target:70,mode:'heat'}};
const SUGGEST={switch:'g-light',dimmer:'g-light',fan:'g-climate',blinds:'g-climate',thermostat:'g-climate',lock:'g-sec',speaker:'g-media'};
const GROUP_ICONS=['bulb','thermo','shield','music','plug','home','spark','moon','sun','box'];
const MASTER_TYPES=['switch','dimmer','plug','fan','speaker'];

function seed(){return{
  groups:[{id:'g-light',name:'Lighting',icon:'bulb'},{id:'g-climate',name:'Climate',icon:'thermo'},{id:'g-sec',name:'Security',icon:'shield'},{id:'g-media',name:'Media',icon:'music'}],
  devices:[
    {id:'d1',type:'dimmer',name:'Ceiling light',room:'Living room',group:'g-light',on:true,level:80},
    {id:'d2',type:'dimmer',name:'Pendants',room:'Kitchen',group:'g-light',on:true,level:60},
    {id:'d3',type:'switch',name:'Hallway light',room:'Hallway',group:'g-light',on:false},
    {id:'d4',type:'switch',name:'Porch light',room:'Outside',group:'g-light',on:true},
    {id:'d5',type:'dimmer',name:'Bedside lamp',room:'Bedroom',group:'g-light',on:false,level:40},
    {id:'d6',type:'thermostat',name:'Thermostat',room:'Hallway',group:'g-climate',current:68,target:70,mode:'heat'},
    {id:'d7',type:'fan',name:'Ceiling fan',room:'Bedroom',group:'g-climate',on:false,speed:2},
    {id:'d8',type:'blinds',name:'Blinds',room:'Living room',group:'g-climate',level:100},
    {id:'d9',type:'lock',name:'Front door',room:'Entry',group:'g-sec',locked:true},
    {id:'d10',type:'lock',name:'Back door',room:'Kitchen',group:'g-sec',locked:false},
    {id:'d11',type:'speaker',name:'Speaker',room:'Living room',group:'g-media',on:true,volume:35},
    {id:'d12',type:'plug',name:'TV',room:'Living room',group:'g-media',on:true,watts:84},
    {id:'d13',type:'plug',name:'Coffee maker',room:'Kitchen',group:null,on:false,watts:900}
  ]};}

const KEY='home-panel-v1';
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.devices))state=seed();
let ui={filter:'all',editing:false,sheet:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const dev=id=>state.devices.find(d=>d.id===id);
const grp=id=>state.groups.find(g=>g.id===id);
const uid=p=>p+Math.random().toString(36).slice(2,8);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function isActive(d){
  if(d.type==='blinds')return d.level>0;
  if(d.type==='lock')return !d.locked;
  if(d.type==='thermostat')return d.mode!=='off';
  return !!d.on;
}
function tone(d){
  if(d.type==='lock')return d.locked?'ok':'alert';
  if(d.type==='thermostat')return d.mode==='heat'?'warm':d.mode==='cool'?'cool':'off';
  if(d.type==='blinds'||d.type==='fan')return isActive(d)?'cool':'off';
  return d.on?'warm':'off';
}
const SPEEDS=['Low','Medium','High'];
function stateText(d){
  switch(d.type){
    case 'switch':return d.on?'On':'Off';
    case 'dimmer':return d.on?`On · ${d.level}%`:'Off';
    case 'plug':return d.on?`On · ${d.watts} W`:'Off';
    case 'fan':return d.on?`On · ${SPEEDS[d.speed-1]}`:'Off';
    case 'blinds':return d.level===0?'Closed':d.level===100?'Open':`${d.level}% open`;
    case 'speaker':return d.on?`Playing · vol ${d.volume}`:'Paused';
    case 'lock':return d.locked?'Locked':'Unlocked';
    case 'thermostat':return d.mode==='off'?'Off':`${d.mode==='heat'?'Heating':'Cooling'} to ${d.target}°`;
  }
}
const iconFor=d=>d.type==='lock'&&!d.locked?'unlock':TYPES[d.type].icon;

function toggle(d){
  switch(d.type){
    case 'blinds':d.level=d.level>0?0:100;break;
    case 'lock':d.locked=!d.locked;break;
    case 'thermostat':openSheet({kind:'control',id:d.id});return;
    default:d.on=!d.on;
  }
  save();renderLive();
}

/* ---------- render ---------- */
function renderClock(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');
  document.getElementById('date').textContent=n.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
}
function renderSummary(){
  const lights=state.devices.filter(d=>TYPES[d.type].light&&d.on).length;
  const t=state.devices.find(d=>d.type==='thermostat');
  const locks=state.devices.filter(d=>d.type==='lock');
  const open=locks.filter(d=>!d.locked);
  let h=`<span class="chip">${svg('bulb')}${lights===0?'All lights off':lights+(lights===1?' light on':' lights on')}</span>`;
  if(t)h+=`<span class="chip">${svg('thermo')}${t.current}° inside</span>`;
  if(open.length)h+=open.map(d=>`<button class="chip alert" data-act="more" data-id="${d.id}">${svg('unlock')}${esc(d.name)} unlocked</button>`).join('');
  else if(locks.length)h+=`<span class="chip ok">${svg('lock')}Doors locked</span>`;
  document.getElementById('summary').innerHTML=h;
}
function renderGroups(){
  const cnt=id=>state.devices.filter(d=>d.group===id).length;
  let h=`<button class="g" data-act="filter" data-g="all" aria-current="${ui.filter==='all'}">${svg('grid')}All devices<span class="n">${state.devices.length}</span></button>`;
  h+=state.groups.map(g=>`<button class="g" data-act="filter" data-g="${g.id}" aria-current="${ui.filter===g.id}">${svg(g.icon)}${esc(g.name)}<span class="n">${cnt(g.id)}</span></button>`).join('');
  if(cnt(null))h+=`<button class="g" data-act="filter" data-g="none" aria-current="${ui.filter==='none'}">${svg('box')}Other<span class="n">${cnt(null)}</span></button>`;
  h+=`<button class="g new" data-act="new-group">${svg('plus')}New group</button>`;
  document.getElementById('groups').innerHTML=h;
}
const SCENES=[
  {id:'morning',name:'Good morning',icon:'sun'},
  {id:'movie',name:'Movie night',icon:'film'},
  {id:'away',name:'Away',icon:'away'},
  {id:'night',name:'Good night',icon:'moon'}
];
function renderScenes(){
  document.getElementById('scenes').innerHTML=SCENES.map(s=>`<button class="scene" data-act="scene" data-s="${s.id}">${svg(s.icon)}${s.name}</button>`).join('');
}
function masterFor(devs){
  const locks=devs.filter(d=>d.type==='lock');
  const tg=devs.filter(d=>MASTER_TYPES.includes(d.type));
  if(locks.length&&locks.length>=tg.length){
    return locks.some(d=>!d.locked)?{label:'Lock all',act:'lockall'}:null;
  }
  if(!tg.length)return null;
  return tg.some(d=>d.on)?{label:'Turn all off',act:'alloff'}:{label:'Turn all on',act:'allon'};
}
function tileHTML(d){
  const tn=tone(d), canToggle=d.type!=='thermostat';
  return `<div class="tile-wrap" data-id="${d.id}">
    <button class="tile tone-${tn}" data-act="tap" data-id="${d.id}" ${canToggle?`aria-pressed="${isActive(d)}"`:''} aria-label="${esc(d.name)}, ${esc(d.room)}, ${stateText(d)}">
      <span class="tile-top"><span class="tile-ico">${svg(iconFor(d))}</span>${d.type==='thermostat'?`<span class="temp">${d.current}°</span>`:''}</span>
      <span class="tile-name">${esc(d.name)}</span>
      <span class="tile-room">${esc(d.room||'No room')}</span>
      <span class="tile-state">${stateText(d)}</span>
    </button>
    <button class="tile-more" data-act="more" data-id="${d.id}" aria-label="Adjust ${esc(d.name)}">${svg('dots')}</button>
    <button class="tile-remove" data-act="remove" data-id="${d.id}" aria-label="Remove ${esc(d.name)}">${svg('x')}</button>
  </div>`;
}
function sectionHTML(g){
  const gid=g?g.id:null;
  const devs=state.devices.filter(d=>d.group===gid);
  const m=masterFor(devs);
  const name=g?g.name:'Other';
  return `<section>
    <div class="sec-head">
      <h2>${esc(name)}</h2><span class="count">${devs.length} ${devs.length===1?'device':'devices'}</span>
      <span class="spacer"></span>
      ${m?`<button class="pill-btn master" data-act="${m.act}" data-g="${gid??'none'}">${m.label}</button>`:''}
      ${g?`<span class="sec-edit"><button class="pill-btn" data-act="edit-group" data-g="${g.id}">Rename</button></span>`:''}
    </div>
    <div class="grid">
      ${devs.map(tileHTML).join('')}
      <button class="add-tile" data-act="add" data-g="${gid??'none'}">${svg('plus')}Add to ${esc(name)}</button>
    </div>
    ${devs.length===0?`<p class="empty">No devices in ${esc(name)} yet. Tap Add device to put one here.</p>`:''}
  </section>`;
}
function renderSections(){
  let list;
  if(ui.filter==='all'){
    list=[...state.groups];
    if(state.devices.some(d=>d.group===null))list.push(null);
  }else if(ui.filter==='none')list=[null];
  else{const g=grp(ui.filter); list=g?[g]:[];}
  document.getElementById('sections').innerHTML=list.map(sectionHTML).join('');
}
function renderLive(){renderSummary();renderGroups();renderSections()}
function renderAll(){renderClock();renderScenes();renderLive();document.body.classList.toggle('editing',ui.editing);document.getElementById('editBtn').textContent=ui.editing?'Done':'Edit'}

/* ---------- sheets ---------- */
function openSheet(s){ui.sheet=s;renderSheet(true)}
function closeSheet(){ui.sheet=null;document.getElementById('sheetRoot').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
let lastFocus=null;
function renderSheet(first){
  const root=document.getElementById('sheetRoot');
  const s=ui.sheet; if(!s){root.innerHTML='';return}
  let body='';
  if(s.kind==='control')body=controlBody(dev(s.id));
  else if(s.kind==='device')body=deviceForm(s);
  else if(s.kind==='group')body=groupForm(s);
  if(!body){closeSheet();return}
  const scroll=root.querySelector('.sheet')?.scrollTop||0;
  if(first)lastFocus=document.activeElement;
  root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="grab"></div>${body}</div></div>`;
  const sh=root.querySelector('.sheet'); sh.scrollTop=scroll;
  root.querySelectorAll('input[type=range]').forEach(paintRange);
  if(first){const f=sh.querySelector('[autofocus]')||sh.querySelector('button');f&&f.focus({preventScroll:true})}
}
function paintRange(r){const p=(r.value-r.min)/(r.max-r.min)*100;r.style.setProperty('--p',p+'%')}
function head(d){
  const g=grp(d.group);
  return `<div class="sh-head"><span class="tile-ico" style="background:var(--bg)">${svg(iconFor(d))}</span>
    <div class="grow"><h2 class="sh-title" id="shTitle">${esc(d.name)}</h2><div class="sh-sub">${esc(d.room||'No room')} · ${esc(g?g.name:'Other')}</div></div>
    <button class="icon-btn" data-act="edit-device" data-id="${d.id}" aria-label="Edit ${esc(d.name)}">${svg('pencil')}</button>
    <button class="icon-btn" data-act="close" aria-label="Close">${svg('x')}</button></div>`;
}
function range(field,val,label,out,fill){
  return `<div><div class="field-label"><label for="rg-${field}">${label}</label><output id="out-${field}">${out}</output></div>
  <input class="big" type="range" id="rg-${field}" data-field="${field}" min="0" max="100" step="1" value="${val}" style="--fill:var(${fill})"></div>`;
}
function controlBody(d){
  if(!d)return'';
  let h=head(d);
  const power=(onLabel,offLabel)=>`<button class="power" data-act="power" aria-pressed="${!!d.on}">${svg('power')}${d.on?onLabel:offLabel}</button>`;
  switch(d.type){
    case 'switch':h+=power('On · tap to turn off','Off · tap to turn on');break;
    case 'dimmer':
      h+=power('On','Off');
      h+=range('level',d.level,'Brightness',d.level+'%','--warm');
      h+=`<div class="presets" style="margin-top:-6px">${[10,25,50,75,100].map(v=>`<button data-act="preset" data-v="${v}" aria-label="Set brightness to ${v}%">${v}%</button>`).join('')}</div>`;
      break;
    case 'plug':
      h+=power('On','Off');
      h+=`<div class="readout"><span>Power draw now</span><b>${d.on?d.watts:0} W</b></div>`;break;
    case 'fan':
      h+=power('On','Off');
      h+=`<div><div class="field-label">Speed</div><div class="seg">${SPEEDS.map((s,i)=>`<button data-act="speed" data-v="${i+1}" aria-pressed="${d.speed===i+1}">${s}</button>`).join('')}</div></div>`;break;
    case 'speaker':
      h+=`<button class="power" data-act="power" aria-pressed="${!!d.on}">${svg(d.on?'pause':'play')}${d.on?'Playing · tap to pause':'Paused · tap to play'}</button>`;
      h+=range('volume',d.volume,'Volume',d.volume,'--accent');break;
    case 'blinds':
      h+=range('level',d.level,'Open',d.level+'%','--cool');
      h+=`<div class="actions"><button class="btn" data-act="blinds" data-v="0">Close</button><button class="btn" data-act="blinds" data-v="50">Half</button><button class="btn" data-act="blinds" data-v="100">Open</button></div>`;break;
    case 'lock':
      h+=`<button class="power ${d.locked?'lock-on':'lock-off'}" data-act="lock">${svg(d.locked?'lock':'unlock')}${d.locked?'Locked · tap to unlock':'Unlocked · tap to lock'}</button>`;break;
    case 'thermostat':
      h+=`<div class="thermo"><button class="step" data-act="temp" data-v="-1" aria-label="Lower target">${svg('minus')}</button>
        <div><div class="cap">Set to</div><div class="big-num" aria-live="polite">${d.target}°</div><div class="cap">${d.current}° inside now</div></div>
        <button class="step" data-act="temp" data-v="1" aria-label="Raise target">${svg('plus')}</button></div>
        <div><div class="field-label">Mode</div><div class="seg">${['heat','cool','off'].map(m=>`<button data-act="mode" data-v="${m}" aria-pressed="${d.mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>`;break;
  }
  return h;
}
function deviceForm(s){
  const dr=s.draft, isNew=!s.id;
  let h=`<div class="sh-head"><div class="grow"><h2 class="sh-title" id="shTitle">${isNew?'Add a device':'Edit device'}</h2>
    <div class="sh-sub">${isNew?'Pick what kind of device it is, then name it.':'Rename it, change its room, or move it to another group.'}</div></div>
    <button class="icon-btn" data-act="close" aria-label="Close">${svg('x')}</button></div>`;
  if(isNew){
    h+=`<div><div class="lbl">Type</div><div class="types">${Object.entries(TYPES).map(([k,t])=>`<button class="type" data-act="pick-type" data-v="${k}" aria-pressed="${dr.type===k}">${svg(t.icon)}${t.label}</button>`).join('')}</div></div>`;
  }
  if(dr.type){
    const rooms=[...new Set(state.devices.map(d=>d.room).filter(Boolean))];
    h+=`<div><label class="lbl" for="f-name">Name</label><input class="txt" id="f-name" data-draft="name" value="${esc(dr.name)}" autocomplete="off" ${isNew?'':'autofocus'}></div>
      <div><label class="lbl" for="f-room">Room</label><input class="txt" id="f-room" data-draft="room" value="${esc(dr.room)}" list="rooms" autocomplete="off" placeholder="e.g. Kitchen"><datalist id="rooms">${rooms.map(r=>`<option value="${esc(r)}">`).join('')}</datalist></div>
      <div><div class="lbl">Group</div><div class="choices">${state.groups.map(g=>`<button class="choice" data-act="pick-group" data-v="${g.id}" aria-pressed="${dr.group===g.id}">${svg(g.icon)}${esc(g.name)}</button>`).join('')}<button class="choice" data-act="pick-group" data-v="none" aria-pressed="${dr.group===null}">${svg('box')}Other</button></div></div>`;
    if(s.error)h+=`<div class="err" role="alert">${s.error}</div>`;
    h+=`<div class="actions">${!isNew?`<button class="btn danger" data-act="delete-device">Remove</button>`:''}<button class="btn primary" data-act="save-device">${isNew?'Add device':'Save'}</button></div>`;
  }
  return h;
}
function groupForm(s){
  const dr=s.draft,isNew=!s.id;
  let h=`<div class="sh-head"><div class="grow"><h2 class="sh-title" id="shTitle">${isNew?'New group':'Edit group'}</h2>
    <div class="sh-sub">Groups collect devices that do the same job, so you can control them together.</div></div>
    <button class="icon-btn" data-act="close" aria-label="Close">${svg('x')}</button></div>
    <div><label class="lbl" for="g-name">Name</label><input class="txt" id="g-name" data-draft="name" value="${esc(dr.name)}" placeholder="e.g. Garden" autocomplete="off" autofocus></div>
    <div><div class="lbl">Icon</div><div class="choices">${GROUP_ICONS.map(i=>`<button class="choice sq" data-act="pick-icon" data-v="${i}" aria-pressed="${dr.icon===i}" aria-label="${i} icon">${svg(i)}</button>`).join('')}</div></div>`;
  if(s.error)h+=`<div class="err" role="alert">${s.error}</div>`;
  h+=`<div class="actions">${!isNew?`<button class="btn danger" data-act="delete-group">Delete group</button>`:''}<button class="btn primary" data-act="save-group">${isNew?'Create group':'Save'}</button></div>`;
  return h;
}

/* ---------- toast + undo ---------- */
let toastTimer;
function toast(msg,undo){
  const root=document.getElementById('toastRoot');clearTimeout(toastTimer);
  root.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}</div>`;
  toast.undo=undo;
  toastTimer=setTimeout(()=>{root.innerHTML='';toast.undo=null},undo?6000:2800);
}
const snap=()=>JSON.stringify(state);
function flash(id){
  requestAnimationFrame(()=>{const el=document.querySelector(`.tile-wrap[data-id="${id}"]`);if(!el)return;
    el.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1300)});
}

/* ---------- scenes ---------- */
function runScene(id){
  const L=state.devices.filter(d=>TYPES[d.type].light);
  const by=t=>state.devices.filter(d=>d.type===t);
  const before=snap();let msg='';
  if(id==='morning'){
    L.forEach(d=>{if(d.room!=='Outside'){d.on=true;if(d.type==='dimmer')d.level=70}else d.on=false});
    by('blinds').forEach(d=>d.level=100);by('thermostat').forEach(d=>{d.mode='heat';d.target=70});
    msg='Good morning: lights at 70%, blinds open, heat to 70°';
  }else if(id==='movie'){
    L.forEach(d=>{if(d.room==='Living room'&&d.type==='dimmer'){d.on=true;d.level=15}else d.on=false});
    by('blinds').forEach(d=>d.level=0);state.devices.filter(d=>d.type==='plug'&&/tv/i.test(d.name)).forEach(d=>d.on=true);
    by('speaker').forEach(d=>d.on=false);
    msg='Movie night: living room dimmed to 15%, blinds closed';
  }else if(id==='away'||id==='night'){
    L.forEach(d=>d.on=(id==='night'&&d.room==='Outside'));
    by('lock').forEach(d=>d.locked=true);by('speaker').forEach(d=>d.on=false);by('fan').forEach(d=>d.on=false);
    by('thermostat').forEach(d=>{if(d.mode!=='off')d.target=id==='away'?62:66});
    if(id==='night')by('blinds').forEach(d=>d.level=0);
    msg=id==='away'?'Away: lights off, doors locked, heat down to 62°':'Good night: doors locked, porch light on, heat to 66°';
  }
  save();renderLive();toast(msg,before);
}

/* ---------- events ---------- */
let pressTimer=null,longPressed=false;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tile');if(!t||ui.editing)return;
  longPressed=false;clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{longPressed=true;openSheet({kind:'control',id:t.dataset.id})},480);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(pressTimer),true));
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&pressTimer&&Math.abs(e.movementY)>4)clearTimeout(pressTimer)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault()});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act, s=ui.sheet;
  if(act==='scrim'&&e.target!==el)return;
  const d=s&&s.kind==='control'?dev(s.id):null;
  switch(act){
    case 'tap':{
      if(longPressed){longPressed=false;return}
      const x=dev(el.dataset.id);if(!x)return;
      if(ui.editing)openSheet({kind:'device',id:x.id,draft:{type:x.type,name:x.name,room:x.room,group:x.group}});
      else toggle(x);break;}
    case 'more':openSheet({kind:'control',id:el.dataset.id});break;
    case 'edit':ui.editing=!ui.editing;renderAll();break;
    case 'filter':ui.filter=el.dataset.g;renderLive();document.getElementById('main').scrollTop=0;break;
    case 'scene':runScene(el.dataset.s);break;
    case 'alloff':case 'allon':case 'lockall':{
      const gid=el.dataset.g==='none'?null:el.dataset.g;const before=snap();
      const devs=state.devices.filter(x=>x.group===gid);
      if(act==='lockall')devs.filter(x=>x.type==='lock').forEach(x=>x.locked=true);
      else devs.filter(x=>MASTER_TYPES.includes(x.type)).forEach(x=>x.on=act==='allon');
      save();renderLive();
      const gname=grp(gid)?.name||'Other';
      toast(act==='lockall'?`${gname}: all doors locked`:`${gname}: everything turned ${act==='allon'?'on':'off'}`,before);break;}
    case 'remove':{
      const x=dev(el.dataset.id);if(!x)return;const before=snap();
      state.devices=state.devices.filter(y=>y.id!==x.id);save();renderLive();toast(`Removed ${x.name}`,before);break;}
    case 'undo':if(toast.undo){state=JSON.parse(toast.undo);save();closeSheet();renderLive();toast('Undone')}break;
    case 'reset':state=seed();ui.filter='all';save();renderAll();toast('Example home restored');break;
    case 'add':{
      let g=el.dataset.g?(el.dataset.g==='none'?null:el.dataset.g):(ui.filter!=='all'&&ui.filter!=='none'?ui.filter:undefined);
      if(el.dataset.g==='none'||(!el.dataset.g&&ui.filter==='none'))g=null;
      openSheet({kind:'device',id:null,draft:{type:null,name:'',room:'',group:g,groupLocked:g!==undefined}});break;}
    case 'new-group':openSheet({kind:'group',id:null,draft:{name:'',icon:'home'}});break;
    case 'edit-group':{const g=grp(el.dataset.g);if(g)openSheet({kind:'group',id:g.id,draft:{name:g.name,icon:g.icon}});break;}
    case 'close':closeSheet();break;
    case 'scrim':closeSheet();break;
    /* control sheet */
    case 'power':if(d){d.on=!d.on;save();renderLive();renderSheet()}break;
    case 'preset':if(d){d.level=+el.dataset.v;d.on=true;save();renderLive();renderSheet()}break;
    case 'speed':if(d){d.speed=+el.dataset.v;d.on=true;save();renderLive();renderSheet()}break;
    case 'blinds':if(d){d.level=+el.dataset.v;save();renderLive();renderSheet()}break;
    case 'lock':if(d){d.locked=!d.locked;save();renderLive();renderSheet()}break;
    case 'temp':if(d){d.target=Math.max(50,Math.min(86,d.target+ +el.dataset.v));if(d.mode==='off')d.mode=d.target>=d.current?'heat':'cool';save();renderLive();renderSheet()}break;
    case 'mode':if(d){d.mode=el.dataset.v;save();renderLive();renderSheet()}break;
    case 'edit-device':{const x=dev(el.dataset.id);if(x)openSheet({kind:'device',id:x.id,draft:{type:x.type,name:x.name,room:x.room,group:x.group}});break;}
    /* device form */
    case 'pick-type':{
      const dr=s.draft,prevLabel=dr.type?TYPES[dr.type].label:'';
      dr.type=el.dataset.v;
      if(!dr.name||dr.name===prevLabel)dr.name=TYPES[dr.type].label;
      if(!dr.groupLocked){const sg=SUGGEST[dr.type];dr.group=sg&&grp(sg)?sg:null}
      renderSheet();break;}
    case 'pick-group':s.draft.group=el.dataset.v==='none'?null:el.dataset.v;s.draft.groupLocked=true;renderSheet();break;
    case 'save-device':{
      const dr=s.draft;const name=dr.name.trim();
      if(!name){s.error='Give the device a name so you can find it later.';renderSheet();return}
      if(s.id){const x=dev(s.id);Object.assign(x,{name,room:dr.room.trim(),group:dr.group});save();closeSheet();renderLive();toast(`Saved ${name}`);flash(x.id)}
      else{
        const x={id:uid('d'),type:dr.type,name,room:dr.room.trim(),group:dr.group,...structuredClone(DEFAULTS[dr.type])};
        state.devices.push(x);save();
        if(ui.filter!=='all'&&ui.filter!==(x.group??'none'))ui.filter='all';
        closeSheet();renderLive();toast(`Added ${name} to ${grp(x.group)?.name||'Other'}`);flash(x.id);
      }break;}
    case 'delete-device':{const x=dev(s.id);if(!x)return;const before=snap();state.devices=state.devices.filter(y=>y.id!==x.id);save();closeSheet();renderLive();toast(`Removed ${x.name}`,before);break;}
    /* group form */
    case 'pick-icon':s.draft.icon=el.dataset.v;renderSheet();break;
    case 'save-group':{
      const name=s.draft.name.trim();
      if(!name){s.error='Give the group a name, like Garden or Kids’ rooms.';renderSheet();return}
      if(s.id)Object.assign(grp(s.id),{name,icon:s.draft.icon});
      else{const g={id:uid('g'),name,icon:s.draft.icon};state.groups.push(g);ui.filter=g.id}
      save();closeSheet();renderLive();toast(s.id?`Saved ${name}`:`Created ${name}. Add devices to it from here.`);break;}
    case 'delete-group':{
      const g=grp(s.id);if(!g)return;const before=snap();const n=state.devices.filter(x=>x.group===g.id).length;
      state.devices.forEach(x=>{if(x.group===g.id)x.group=null});state.groups=state.groups.filter(y=>y.id!==g.id);
      if(ui.filter===g.id)ui.filter='all';save();closeSheet();renderLive();
      toast(n?`Deleted ${g.name}. Its ${n} ${n===1?'device moved':'devices moved'} to Other.`:`Deleted ${g.name}`,before);break;}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.draft&&ui.sheet&&ui.sheet.draft){ui.sheet.draft[t.dataset.draft]=t.value;return}
  if(t.dataset.field&&ui.sheet&&ui.sheet.kind==='control'){
    const d=dev(ui.sheet.id);if(!d)return;const v=+t.value;d[t.dataset.field]=v;
    if(d.type==='dimmer'){d.on=v>0}
    paintRange(t);
    const out=document.getElementById('out-'+t.dataset.field);if(out)out.textContent=d.type==='speaker'?v:v+'%';
    const p=document.querySelector('.sheet .power');
    if(p&&d.type==='dimmer'){p.setAttribute('aria-pressed',d.on);p.lastChild.textContent=d.on?'On':'Off'}
    save();renderLive();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet)closeSheet();
  if(e.key==='Enter'&&e.target.matches('.txt')){const b=document.querySelector('.sheet .btn.primary');b&&b.click()}
});

/* thermostat drifts toward its target so the panel feels alive */
setInterval(()=>{let ch=false;state.devices.forEach(d=>{if(d.type!=='thermostat'||d.mode==='off')return;
  if(d.mode==='heat'&&d.current<d.target){d.current++;ch=true}
  if(d.mode==='cool'&&d.current>d.target){d.current--;ch=true}});
  if(ch){save();renderLive();if(ui.sheet&&ui.sheet.kind==='control'&&dev(ui.sheet.id)?.type==='thermostat')renderSheet()}},20000);
setInterval(renderClock,15000);
renderAll();
</script>
